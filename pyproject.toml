[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hovita"
version = "1.0.0"
description = "HOVITA — Autonomous Single-Persona AI System (Zero-to-Production)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy>=2.0.32,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "langgraph>=0.2.50,<1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<3.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "fakeredis>=2.24.0,<3.0.0",
    "minio>=7.2.0,<8.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pillow>=10.4.0,<12.0.0",
    "imageio-ffmpeg>=0.5.1,<1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "cryptography>=43.0.0,<45.0.0",
    "duckduckgo-search>=6.0.0,<9.0.0",
]

[project.optional-dependencies]
postgres-checkpoint = [
    "langgraph-checkpoint-postgres>=2.0.0,<3.0.0",
    "pgvector>=0.3.2,<1.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[project.scripts]
hovita-api = "hovita.api.main:run"
hovita-worker = "hovita.resources.worker:run"
hovita-health = "scripts.healthcheck:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend/src"
packages = ["hovita"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "."]
asyncio_mode = "auto"
addopts = "-ra"
