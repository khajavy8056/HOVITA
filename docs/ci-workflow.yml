name: HOVITA CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend & dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check backend/src tests scripts
      - name: Typecheck (mypy)
        run: mypy backend/src
      - name: Migrations & Seed
        run: |
          alembic upgrade head
          python -m hovita.db.seed
      - name: Unit Tests
        run: pytest -q tests/unit
      - name: Contract Tests
        run: pytest -q tests/contract
      - name: Integration Tests
        run: pytest -q tests/integration
      - name: Resilience Tests
        run: pytest -q tests/resilience
      - name: Security Tests
        run: pytest -q tests/security
      - name: Smoke Test
        run: python scripts/smoke_test.py

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck & Build Next.js
        run: |
          npm ci
          npm run lint
          npm run build
